<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin & Win | Carter's OshKosh Lebanon</title>
    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" />
    <link rel="preload" href="assets/wheel-bg.webp" as="image" />
    <link rel="preload" href="assets/wheel-bg-mobile.webp" as="image" />
    <link rel="preload" href="assets/wheel-stand.webp" as="image" />
    <link rel="preload" href="assets/gift-pile.webp" as="image" />
    <link rel="preload" href="assets/logo.png" as="image" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-loader" id="pageLoader" role="status" aria-label="Loading">
      <span class="page-loader-icon" aria-hidden="true"></span>
    </div>
    <main>
      <section
        class="screen is-active"
        id="registerScreen"
        aria-label="Register to spin"
      >
        <div class="card register-card">
          <img
            class="brand-lockup"
            src="assets/logo.png"
            alt="Carter's and OshKosh B'gosh"
          />

          <form class="form-grid" id="registerForm">
            <div class="form-field">
              <label for="customerName">
                Name <span class="required-sign" aria-hidden="true"style="color: red;">*</span>
              </label>
              <input
                id="customerName"
                name="customerName"
                type="text"
                autocomplete="name"
                required
              />
            </div>

            <div class="form-field">
              <label for="customerEmail">Email</label>
              <input
                id="customerEmail"
                name="customerEmail"
                type="email"
                autocomplete="email"
              />
            </div>

            <div class="form-field">
              <label for="customerPhone">
                Phone Number <span class="required-sign" aria-hidden="true" style="color: red;">*</span>
              </label>
              <input
                id="customerPhone"
                name="customerPhone"
                type="tel"
                autocomplete="tel"
                inputmode="tel"
                placeholder="03123456"
                pattern="03[0-9 ]{6,8}"
                title="Enter a Lebanese mobile number starting with 03"
                required
              />
            </div>

            <button class="submit-btn" type="submit">Submit</button>
          </form>

          <img
            class="gift-pile"
            src="assets/gift-pile.webp"
            alt="Blue and white wrapped gifts"
          />
        </div>
      </section>

      <section
        class="screen wheel-screen"
        id="wheelScreen"
        aria-label="Spin and win"
      >
        <div class="wheel-stage">
          <h1 class="wheel-heading">Spin &amp; Win!</h1>

          <div class="wheel-area">
            <div class="wheel-wrap">
              <img
                class="wheel-stand"
                src="assets/wheel-stand.webp"
                alt=""
                aria-hidden="true"
              />
              <div class="pointer" aria-hidden="true"></div>
              <div class="wheel" id="wheel" aria-hidden="true"></div>
              <button class="go-button" id="goButton" type="button">GO</button>
            </div>

            <img class="wheel-gifts" src="assets/gift-pile.webp" alt="" />
          </div>

          <img
            class="brand-lockup bottom-brand"
            src="assets/logo.png"
            alt="Carter's and OshKosh B'gosh"
          />
        </div>
      </section>

      <section class="screen" id="resultScreen" aria-label="Spin result">
        <div class="card result-card">
          <img
            class="brand-lockup"
            src="assets/logo.png"
            alt="Carter's and OshKosh B'gosh"
          />

          <h2 class="result-title" id="resultTitle">
            You already Spun the wheel...
          </h2>
          <div class="player-details" aria-label="Player details">
            <p>Name: <span id="playerName">-</span></p>
            <p>Phone: <span id="playerPhone">-</span></p>
          </div>
          <p class="result-line">
            Result: <span id="resultName">30% Gift Voucher</span>
          </p>
          <p class="promo-label">Promocode:</p>
          <p class="promo-code" id="promoCode">GIFT30-B9HF-9ATV</p>
          <p class="hard-luck-message is-hidden" id="hardLuckMessage">
            Hard luck! Thank you for playing. We hope to see you again soon.
          </p>
          <p class="expiry">
            Expiry Date: <span id="expiryDate">26 Jun 2026, 04:45 PM</span>
          </p>
          <p class="branch-line">Only in Ghazir Branch</p>

          <div class="result-actions">
            <button class="copy-btn" id="copyButton" type="button">
              Copy Promocode
            </button>
            <button class="return-btn" id="backButton" type="button">
              Back to Register
            </button>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
