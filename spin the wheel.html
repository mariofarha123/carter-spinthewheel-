<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin & Win | Carter's OshKosh Lebanon</title>
    <style>
      :root {
        --carters-blue: #08a9e6;
        --oshkosh-navy: #08284d;
        --deep-blue: #06355f;
        --mid-blue: #42a9dc;
        --sky: #8fcdeb;
        --pale-sky: #dff3fb;
        --white: #ffffff;
        --line: #d6dfe8;
        --text: #071d3d;
        --muted: #55708a;
        --danger: #ec1b25;
        --shadow: 0 24px 70px rgba(7, 29, 61, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        height: 100svh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at 50% 105%,
            rgba(255, 255, 255, 0.68),
            transparent 30%
          ),
          repeating-conic-gradient(
            from -10deg at 50% 68%,
            rgba(255, 255, 255, 0.13) 0deg 8deg,
            transparent 8deg 18deg
          ),
          linear-gradient(145deg, #9dd5ee 0%, #76bee4 54%, #5bb0dd 100%);
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      .screen {
        height: 100vh;
        height: 100svh;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px 18px;
        position: relative;
        isolation: isolate;
        overflow: hidden;
      }

      .screen.is-active {
        display: flex;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        line-height: 1;
        color: var(--oshkosh-navy);
        margin-bottom: 26px;
        white-space: nowrap;
      }

      .carters-word {
        color: var(--carters-blue);
        font-size: 58px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .brand-divider {
        width: 3px;
        height: 58px;
        background: #8a99a5;
      }

      .oshkosh-word {
        color: var(--oshkosh-navy);
        font-size: 42px;
        font-weight: 950;
        letter-spacing: -0.07em;
      }

      .b-gosh {
        display: inline-block;
        margin-left: 6px;
        font-size: 0.66em;
        font-style: italic;
        letter-spacing: -0.08em;
        transform: rotate(-4deg);
      }

      .card {
        width: min(880px, 100%);
        max-height: calc(100svh - 28px);
        background: var(--white);
        border-radius: 18px;
        padding: 30px 44px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .register-card {
        padding-bottom: 22px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px 30px;
      }

      .form-field:first-child {
        grid-column: 1 / -1;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #021532;
        font-size: 17px;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 15px;
        color: var(--text);
        outline: none;
        transition:
          border 170ms ease,
          box-shadow 170ms ease;
      }

      input:focus {
        border-color: var(--carters-blue);
        box-shadow: 0 0 0 4px rgba(8, 169, 230, 0.12);
      }

      .submit-btn,
      .return-btn,
      .copy-btn {
        min-height: 50px;
        border: 0;
        border-radius: 8px;
        background: var(--mid-blue);
        color: var(--white);
        padding: 0 24px;
        cursor: pointer;
        transition:
          transform 160ms ease,
          background 160ms ease;
      }

      .submit-btn {
        grid-column: 1 / -1;
        width: 100%;
        border: 2px solid #14b8f0;
        background: var(--white);
        color: var(--text);
        min-height: 46px;
        font-size: 18px;
      }

      .submit-btn:hover,
      .return-btn:hover,
      .copy-btn:hover {
        transform: translateY(-1px);
      }

      .submit-btn:hover {
        background: #f4fbff;
      }

      .gift-pile {
        display: block;
        width: min(330px, 58vw);
        max-height: 21vh;
        margin: 18px auto 0;
        object-fit: contain;
      }

      .screen.wheel-screen {
        --wheel-bg-image: url("assets/wheel-bg.webp");
        --stage-inline-padding: clamp(16px, 3vw, 42px);
        --stage-padding-top: clamp(30px, 5svh, 56px);
        --stage-padding-bottom: clamp(14px, 2.8svh, 30px);
        --stage-row-gap: clamp(10px, 2svh, 24px);
        --wheel-size: min(520px, 50vw, calc(100svh - 340px));
        --wheel-gift-width: min(300px, 31vw);
        --wheel-gift-gap: clamp(8px, 1.8svh, 24px);
        --wheel-heading-size: clamp(40px, 4.1vw, 58px);
        --bottom-brand-carters-size: clamp(27px, 2.7vw, 34px);
        --stand-scale: 122%;
        --stand-offset-y: -13%;

        align-items: stretch;
        padding: 0;
        overflow: hidden;
        background-color: #74c3e6;
        background-image: var(--wheel-bg-image);
        background-position: center;
        background-repeat: no-repeat;
        background-size: 100% 100%;
      }

      .wheel-stage {
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: var(--stage-row-gap);
        justify-items: center;
        align-items: stretch;
        position: relative;
        padding: var(--stage-padding-top) var(--stage-inline-padding)
          var(--stage-padding-bottom);
        overflow: hidden;
      }

      .wheel-heading {
        position: relative;
        z-index: 1;
        align-self: start;
        margin: 0;
        color: var(--white);
        font-size: var(--wheel-heading-size);
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.03em;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 0 4px 18px rgba(8, 40, 77, 0.15);
      }

      .wheel-area {
        position: relative;
        z-index: 1;
        align-self: center;
        width: var(--wheel-size);
        max-width: 100%;
        display: grid;
        grid-template-rows: auto auto;
        gap: var(--wheel-gift-gap);
        justify-items: center;
        align-content: center;
        isolation: isolate;
      }

      .wheel-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 18px 22px rgba(8, 40, 77, 0.18));
      }

      .wheel-stand {
        position: absolute;
        top: var(--stand-offset-y);
        left: 50%;
        width: var(--stand-scale);
        height: auto;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 6;
      }

      .wheel-dot-layer {
        position: absolute;
        top: var(--stand-offset-y);
        left: 50%;
        width: var(--stand-scale);
        aspect-ratio: 1122 / 1402;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 5;
      }

      .pointer {
        position: absolute;
        top: clamp(13px, calc(var(--wheel-size) * 0.04), 22px);
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: clamp(14px, calc(var(--wheel-size) * 0.04), 22px) solid
          transparent;
        border-right: clamp(14px, calc(var(--wheel-size) * 0.04), 22px) solid
          transparent;
        border-top: clamp(32px, calc(var(--wheel-size) * 0.085), 48px) solid
          var(--deep-blue);
        z-index: 7;
      }

      .wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        background: var(--deep-blue);
        border: clamp(14px, calc(var(--wheel-size) * 0.055), 30px) solid
          var(--deep-blue);
        transition: transform 2.8s cubic-bezier(0.14, 0.8, 0.2, 1);
        z-index: 2;
      }

      .wheel::before {
        content: "";
        position: absolute;
        inset: 2%;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.55);
        pointer-events: none;
      }

      .wheel-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .slice-text {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 950;
        line-height: 1;
        text-anchor: middle;
        dominant-baseline: middle;
        text-transform: uppercase;
        pointer-events: none;
      }

      .slice-text.is-light {
        fill: var(--white);
      }

      .slice-text.is-blue {
        fill: var(--carters-blue);
      }

      .wheel::after {
        content: "";
        position: absolute;
        inset: 42%;
        border-radius: 50%;
        background: var(--deep-blue);
        box-shadow:
          0 0 0 7px #0b9ed7,
          0 0 0 12px rgba(255, 255, 255, 0.55);
        z-index: 3;
      }

      .stand-dot {
        position: absolute;
        left: calc(var(--dot-x) * 1%);
        top: calc(var(--dot-y) * 1%);
        width: 1.8%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--white);
        transform: translate(-50%, -50%);
      }

      .go-button {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(54px, calc(var(--wheel-size) * 0.155), 88px);
        height: clamp(54px, calc(var(--wheel-size) * 0.155), 88px);
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: clamp(5px, calc(var(--wheel-size) * 0.014), 7px) solid
          var(--deep-blue);
        background: #12aee8;
        color: var(--white);
        display: grid;
        place-items: center;
        font-size: clamp(20px, calc(var(--wheel-size) * 0.06), 34px);
        font-weight: 950;
        z-index: 8;
        cursor: pointer;
        box-shadow: 0 8px 16px rgba(8, 40, 77, 0.26);
      }

      .wheel-gifts {
        position: relative;
        width: var(--wheel-gift-width);
        max-width: 82vw;
        max-height: min(16svh, calc(var(--wheel-size) * 0.34));
        object-fit: contain;
        margin: 0;
        z-index: 5;
      }

      .bottom-brand {
        position: relative;
        z-index: 1;
        align-self: end;
        gap: clamp(7px, 1vw, 13px);
        margin: 0;
        transform: none;
        transform-origin: center center;
      }

      .bottom-brand .carters-word {
        font-size: var(--bottom-brand-carters-size);
      }

      .bottom-brand .brand-divider {
        width: max(2px, calc(var(--bottom-brand-carters-size) * 0.045));
        height: calc(var(--bottom-brand-carters-size) * 0.96);
      }

      .bottom-brand .oshkosh-word {
        font-size: calc(var(--bottom-brand-carters-size) * 0.72);
      }

      .result-card {
        text-align: center;
        min-height: 0;
        display: grid;
        align-content: center;
      }

      .result-card .brand-lockup {
        margin-bottom: 34px;
      }

      .result-title {
        margin: 0 0 16px;
        font-size: 32px;
        color: var(--oshkosh-navy);
      }

      .result-line,
      .promo-label,
      .branch-line {
        margin: 0 0 16px;
        font-size: 22px;
      }

      .promo-label {
        margin-bottom: 8px;
        font-size: 19px;
      }

      .promo-code {
        margin: 0 0 18px;
        color: var(--mid-blue);
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .hard-luck-message {
        margin: 0 auto 18px;
        max-width: 540px;
        color: var(--danger);
        font-size: 24px;
        font-weight: 600;
        line-height: 1.35;
      }

      .expiry {
        margin: 0 0 18px;
        color: var(--danger);
        font-size: 20px;
      }

      .promo-code.is-expired {
        color: var(--muted);
        text-decoration: line-through;
      }

      .result-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 4px;
      }

      .copy-btn {
        background: var(--deep-blue);
      }

      .is-hidden {
        display: none;
      }

      @media (min-width: 1200px) and (min-height: 780px) {
        .screen.wheel-screen {
          --stage-padding-top: clamp(38px, 5svh, 58px);
          --stage-padding-bottom: clamp(18px, 2.8svh, 32px);
          --wheel-size: min(530px, 48vw, calc(100svh - 370px));
          --wheel-gift-width: min(330px, 30vw);
          --wheel-heading-size: clamp(52px, 3.7vw, 60px);
          --bottom-brand-carters-size: clamp(30px, 2.4vw, 36px);
        }
      }

      @media (min-width: 1600px) and (min-height: 850px) {
        .screen {
          padding: 30px 24px;
        }

        .card {
          width: min(980px, 100%);
          padding: 38px 54px;
        }

        .brand-lockup {
          gap: 22px;
          margin-bottom: 32px;
        }

        .carters-word {
          font-size: 68px;
        }

        .brand-divider {
          height: 68px;
        }

        .oshkosh-word {
          font-size: 50px;
        }

        .form-grid {
          gap: 26px 36px;
        }

        label {
          font-size: 19px;
        }

        input {
          min-height: 54px;
          font-size: 18px;
        }

        .submit-btn,
        .return-btn,
        .copy-btn {
          min-height: 56px;
          font-size: 19px;
        }

        .gift-pile {
          width: min(390px, 54vw);
          max-height: 24vh;
          margin-top: 24px;
        }

        .screen.wheel-screen {
          --stage-padding-top: clamp(42px, 5svh, 64px);
          --stage-padding-bottom: clamp(20px, 2.8svh, 36px);
          --wheel-size: min(550px, 44vw, calc(100svh - 380px));
          --wheel-gift-width: min(350px, 28vw);
          --wheel-heading-size: clamp(56px, 3.5vw, 64px);
          --bottom-brand-carters-size: clamp(32px, 2.2vw, 38px);
        }

        .result-title {
          font-size: 38px;
        }

        .result-line,
        .promo-label,
        .branch-line {
          font-size: 25px;
        }

        .promo-code,
        .hard-luck-message {
          font-size: 28px;
        }

        .expiry {
          font-size: 22px;
        }
      }

      @media (max-width: 980px) {
        .screen {
          padding: 16px 16px;
        }

        .brand-lockup {
          gap: 14px;
          margin-bottom: 22px;
        }

        .carters-word {
          font-size: 46px;
        }

        .brand-divider {
          height: 48px;
        }

        .oshkosh-word {
          font-size: 34px;
        }

        .card {
          padding: 24px 30px;
        }

        .form-grid {
          gap: 18px 24px;
        }

        .gift-pile {
          width: min(300px, 58vw);
          margin-top: 14px;
        }

        .screen.wheel-screen {
          --stage-padding-top: clamp(24px, 4.2svh, 44px);
          --wheel-size: min(450px, 62vw, calc(100svh - 320px));
          --wheel-gift-width: min(280px, 42vw);
          --wheel-heading-size: clamp(36px, 4.6vw, 46px);
          --bottom-brand-carters-size: clamp(25px, 3vw, 31px);
        }

        .result-card .brand-lockup {
          margin-bottom: 26px;
        }

        .result-title {
          font-size: 28px;
        }

        .result-line,
        .promo-label,
        .branch-line {
          font-size: 20px;
        }

        .promo-code {
          font-size: 22px;
        }

        .hard-luck-message {
          font-size: 22px;
        }

        .expiry {
          font-size: 18px;
        }
      }

      @media (max-width: 980px) and (min-width: 721px) {
        .card {
          width: min(820px, 100%);
        }

        .screen.wheel-screen {
          --wheel-size: min(460px, 64vw, calc(100svh - 310px));
          --wheel-gift-width: min(300px, 40vw);
        }
      }

      @media (max-width: 720px) {
        body {
          overflow: hidden;
        }

        .screen {
          height: 100vh;
          height: 100svh;
          padding: 10px 12px;
          overflow: hidden;
        }

        .card {
          width: min(100%, 500px);
          max-height: none;
          border-radius: 14px;
          padding: 18px 16px;
        }

        .form-grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .form-field:first-child,
        .submit-btn {
          grid-column: auto;
        }

        label {
          font-size: 15px;
        }

        input {
          min-height: 42px;
        }

        .brand-lockup {
          gap: 11px;
          white-space: normal;
          margin-bottom: 16px;
        }

        .brand-divider {
          height: 42px;
        }

        .carters-word {
          font-size: 32px;
        }

        .oshkosh-word {
          font-size: 23px;
        }

        .screen.wheel-screen {
          --stage-inline-padding: clamp(12px, 4vw, 22px);
          --stage-padding-top: clamp(56px, 11svh, 100px);
          --stage-padding-bottom: clamp(10px, 2svh, 18px);
          --stage-row-gap: clamp(6px, 1.4svh, 14px);
          --wheel-size: min(390px, 88vw, calc(100svh - 300px));
          --wheel-gift-width: min(250px, 62vw);
          --wheel-gift-gap: clamp(4px, 1svh, 10px);
          --wheel-heading-size: clamp(25px, 7vw, 34px);
          --bottom-brand-carters-size: clamp(21px, 6.6vw, 28px);
        }

        .result-card {
          min-height: 0;
        }

        .result-card .brand-lockup {
          margin-bottom: 20px;
        }

        .result-title {
          font-size: 24px;
        }

        .result-line,
        .promo-label,
        .branch-line {
          font-size: 18px;
        }

        .promo-code {
          font-size: 19px;
        }

        .hard-luck-message {
          font-size: 19px;
        }

        .expiry {
          font-size: 16px;
        }
      }

      @media (max-width: 450px) {
        .screen {
          padding: 8px 10px;
        }

        .card {
          padding: 15px 13px;
        }

        .brand-lockup {
          gap: 8px;
          margin-bottom: 14px;
        }

        .carters-word {
          font-size: 28px;
        }

        .brand-divider {
          width: 2px;
          height: 34px;
        }

        .oshkosh-word {
          font-size: 20px;
        }

        .form-grid {
          gap: 10px;
        }

        label {
          margin-bottom: 6px;
          font-size: 14px;
        }

        input {
          min-height: 40px;
          padding: 9px 11px;
        }

        .submit-btn,
        .return-btn,
        .copy-btn {
          min-height: 44px;
          padding: 0 16px;
        }

        .gift-pile {
          width: min(250px, 66vw);
          max-height: 17vh;
          margin-top: 12px;
        }

        .screen.wheel-screen {
          --stage-padding-top: clamp(48px, 10svh, 86px);
          --wheel-size: min(340px, 88vw, calc(100svh - 285px));
          --wheel-gift-width: min(220px, 58vw);
          --wheel-heading-size: clamp(24px, 7vw, 30px);
          --bottom-brand-carters-size: clamp(20px, 6.4vw, 25px);
        }

        .result-title {
          margin-bottom: 12px;
          font-size: 22px;
        }

        .result-line,
        .promo-label,
        .branch-line {
          margin-bottom: 12px;
          font-size: 16px;
        }

        .promo-code,
        .hard-luck-message {
          margin-bottom: 14px;
          font-size: 17px;
        }

        .expiry {
          margin-bottom: 14px;
          font-size: 15px;
        }
      }

      @media (orientation: portrait) {
        .screen.wheel-screen {
          --wheel-bg-image: url("assets/wheel-bg-mobile.webp");
        }
      }

      @media (max-height: 680px) and (max-width: 720px) {
        .card {
          padding-top: 12px;
          padding-bottom: 12px;
        }

        .brand-lockup {
          margin-bottom: 10px;
        }

        .form-grid {
          gap: 8px;
        }

        .gift-pile {
          max-height: 13vh;
          margin-top: 8px;
        }

        .screen.wheel-screen {
          --stage-padding-top: clamp(28px, 7svh, 48px);
          --stage-padding-bottom: clamp(6px, 1.5svh, 14px);
          --stage-row-gap: clamp(4px, 1svh, 10px);
          --wheel-size: min(320px, 84vw, calc(100svh - 250px));
          --wheel-gift-width: min(210px, 56vw);
          --wheel-gift-gap: 2px;
          --wheel-heading-size: clamp(23px, 7vw, 29px);
          --bottom-brand-carters-size: clamp(18px, 6vw, 23px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section
        class="screen is-active"
        id="registerScreen"
        aria-label="Register to spin"
      >
        <div class="card register-card">
          <div class="brand-lockup" aria-label="Carter's and OshKosh B'gosh">
            <span class="carters-word">carter's</span>
            <span class="brand-divider"></span>
            <span class="oshkosh-word"
              >OSHKOSH<span class="b-gosh">B'gosh</span></span
            >
          </div>

          <form class="form-grid" id="registerForm">
            <div class="form-field">
              <label for="customerName">Name</label>
              <input
                id="customerName"
                name="customerName"
                type="text"
                autocomplete="name"
              />
            </div>

            <div class="form-field">
              <label for="customerEmail">Email</label>
              <input
                id="customerEmail"
                name="customerEmail"
                type="email"
                autocomplete="email"
              />
            </div>

            <div class="form-field">
              <label for="customerPhone">Phone Number</label>
              <input
                id="customerPhone"
                name="customerPhone"
                type="tel"
                autocomplete="tel"
              />
            </div>

            <button class="submit-btn" type="submit">Submit</button>
          </form>

          <img
            class="gift-pile"
            src="assets/gift-pile.webp"
            alt="Blue and white wrapped gifts"
          />
        </div>
      </section>

      <section
        class="screen wheel-screen"
        id="wheelScreen"
        aria-label="Spin and win"
      >
        <div class="wheel-stage">
          <h1 class="wheel-heading">Spin &amp; Win!</h1>

          <div class="wheel-area">
            <div class="wheel-wrap">
              <img
                class="wheel-stand"
                src="assets/wheel-stand.webp"
                alt=""
                aria-hidden="true"
              />
              <div class="pointer" aria-hidden="true"></div>
              <div class="wheel" id="wheel" aria-hidden="true"></div>
              <button class="go-button" id="goButton" type="button">GO</button>
            </div>

            <img class="wheel-gifts" src="assets/gift-pile.webp" alt="" />
          </div>

          <div
            class="brand-lockup bottom-brand"
            aria-label="Carter's and OshKosh B'gosh"
          >
            <span class="carters-word">carter's</span>
            <span class="brand-divider"></span>
            <span class="oshkosh-word"
              >OSHKOSH<span class="b-gosh">B'gosh</span></span
            >
          </div>
        </div>
      </section>

      <section class="screen" id="resultScreen" aria-label="Spin result">
        <div class="card result-card">
          <div class="brand-lockup" aria-label="Carter's and OshKosh B'gosh">
            <span class="carters-word">carter's</span>
            <span class="brand-divider"></span>
            <span class="oshkosh-word"
              >OSHKOSH<span class="b-gosh">B'gosh</span></span
            >
          </div>

          <h2 class="result-title" id="resultTitle">
            You already Spun the wheel...
          </h2>
          <p class="result-line">
            Result: <span id="resultName">30% Gift Voucher</span>
          </p>
          <p class="promo-label">Promocode:</p>
          <p class="promo-code" id="promoCode">GIFT30-B9HF-9ATV</p>
          <p class="hard-luck-message is-hidden" id="hardLuckMessage">
            Hard luck! Thank you for playing. We hope to see you again soon.
          </p>
          <p class="expiry">
            Expiry Date: <span id="expiryDate">26 Jun 2026, 04:45 PM</span>
          </p>
          <p class="branch-line">Only in Ghazir Branch</p>

          <div class="result-actions">
            <button class="copy-btn" id="copyButton" type="button">
              Copy Promocode
            </button>
            <button class="return-btn" id="backButton" type="button">
              Back to Register
            </button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const GOOGLE_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbyT-H6mvEfaWpQmok_cqoNdqLH_73SIXYasFoeFGK5ISzImm-uIgeLz17qIUOHf0J3g/exec";

      const prizes = [
        {
          label: "30%",
          lines: ["30%"],
          name: "30% Gift Voucher",
          color: "#13aae3",
          textColor: "light",
          fontSize: 8.3,
          radius: 30,
          rotate: "radial",
        },
        {
          label: "Hard Luck",
          lines: ["HARD", "LUCK"],
          name: "Hard Luck",
          color: "#1f4778",
          textColor: "light",
          fontSize: 5.35,
          radius: 32,
          rotate: "tangent",
        },
        {
          label: "50%",
          lines: ["50%"],
          name: "50% Gift Voucher",
          color: "#d9f0f8",
          textColor: "blue",
          fontSize: 8.3,
          radius: 30,
          rotate: "radial",
        },
        {
          label: "20%",
          lines: ["20%"],
          name: "20% Gift Voucher",
          color: "#09a8e1",
          textColor: "light",
          fontSize: 8.3,
          radius: 30,
          rotate: "radial",
        },
        {
          label: "Get 1 Item Free",
          lines: ["GET 1 ITEM", "FOR FREE"],
          name: "Get 1 Item For Free",
          color: "#e5f6fb",
          textColor: "blue",
          fontSize: 4.8,
          radius: 33,
          rotate: "tangent",
        },
      ];

      const registerScreen = document.getElementById("registerScreen");
      const wheelScreen = document.getElementById("wheelScreen");
      const resultScreen = document.getElementById("resultScreen");
      const registerForm = document.getElementById("registerForm");
      const submitButton = registerForm.querySelector(".submit-btn");
      const wheelWrap = document.querySelector(".wheel-wrap");
      const wheel = document.getElementById("wheel");
      const goButton = document.getElementById("goButton");
      const backButton = document.getElementById("backButton");
      const copyButton = document.getElementById("copyButton");
      const resultTitle = document.getElementById("resultTitle");
      const resultName = document.getElementById("resultName");
      const promoCode = document.getElementById("promoCode");
      const expiryDate = document.getElementById("expiryDate");
      const hardLuckMessage = document.getElementById("hardLuckMessage");
      const promoLabel = document.querySelector(".promo-label");
      const expiryLine = document.querySelector(".expiry");
      const branchLine = document.querySelector(".branch-line");
      const sliceAngle = 360 / prizes.length;
      const pointerAngle = 270;
      const spinDurationMs = 3000;
      let isSpinning = false;
      let currentRotation = 0;
      let currentResult = null;
      let currentCustomer = null;
      let pendingSpinResult = null;

      function showScreen(screen) {
        [registerScreen, wheelScreen, resultScreen].forEach((item) => {
          item.classList.toggle("is-active", item === screen);
        });
      }

      function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
        const angleInRadians = (angleInDegrees * Math.PI) / 180;

        return {
          x: centerX + radius * Math.cos(angleInRadians),
          y: centerY + radius * Math.sin(angleInRadians),
        };
      }

      function describeSlice(centerX, centerY, radius, startAngle, endAngle) {
        const start = polarToCartesian(centerX, centerY, radius, startAngle);
        const end = polarToCartesian(centerX, centerY, radius, endAngle);
        const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";

        return [
          `M ${centerX} ${centerY}`,
          `L ${start.x} ${start.y}`,
          `A ${radius} ${radius} 0 ${largeArcFlag} 1 ${end.x} ${end.y}`,
          "Z",
        ].join(" ");
      }

      function createSvgElement(name) {
        return document.createElementNS("http://www.w3.org/2000/svg", name);
      }

      function createWheelDetails() {
        const svg = createSvgElement("svg");
        svg.classList.add("wheel-svg");
        svg.setAttribute("viewBox", "0 0 100 100");
        svg.setAttribute("aria-hidden", "true");

        prizes.forEach((prize, index) => {
          const sliceCenter = index * sliceAngle;
          const slice = createSvgElement("g");
          const labelPoint = polarToCartesian(
            50,
            50,
            prize.radius,
            sliceCenter,
          );
          let labelRotation =
            prize.rotate === "tangent" ? sliceCenter + 90 : sliceCenter;

          if (labelRotation > 90 && labelRotation < 270) {
            labelRotation += 180;
          }

          const path = createSvgElement("path");
          path.setAttribute(
            "d",
            describeSlice(
              50,
              50,
              50,
              sliceCenter - sliceAngle / 2,
              sliceCenter + sliceAngle / 2,
            ),
          );
          path.setAttribute("fill", prize.color);
          slice.appendChild(path);

          const text = createSvgElement("text");
          text.classList.add(
            "slice-text",
            prize.textColor === "blue" ? "is-blue" : "is-light",
          );
          text.setAttribute("x", labelPoint.x.toFixed(3));
          text.setAttribute("y", labelPoint.y.toFixed(3));
          text.setAttribute("font-size", prize.fontSize);
          text.setAttribute(
            "transform",
            `rotate(${labelRotation} ${labelPoint.x.toFixed(3)} ${labelPoint.y.toFixed(3)})`,
          );

          prize.lines.forEach((line, lineIndex, lines) => {
            const tspan = createSvgElement("tspan");
            tspan.setAttribute("x", labelPoint.x.toFixed(3));
            tspan.setAttribute(
              "dy",
              lineIndex === 0
                ? `${(1 - lines.length) * prize.fontSize * 0.52}`
                : `${prize.fontSize * 0.96}`,
            );
            tspan.textContent = line;
            text.appendChild(tspan);
          });

          slice.appendChild(text);
          svg.appendChild(slice);
        });

        wheel.prepend(svg);

        const dotLayer = document.createElement("div");
        dotLayer.className = "wheel-dot-layer";

        const standHolePoints = [
          [560.1, 133.7],
          [408.5, 160.7],
          [711.9, 160.8],
          [275.5, 237.8],
          [845.4, 237.8],
          [176.6, 355.1],
          [943.3, 355.1],
          [123.9, 501.7],
          [996.3, 501.7],
          [123.8, 655.6],
          [996.2, 655.7],
          [176.7, 800.6],
          [943.3, 800.7],
          [275.6, 918.6],
          [845.3, 918.7],
          [408.5, 996.3],
          [711.8, 996.3],
          [560.1, 1022.9],
        ];

        standHolePoints.forEach(([x, y]) => {
          const dot = document.createElement("span");
          dot.className = "stand-dot";
          dot.style.setProperty("--dot-x", (x / 1122) * 100);
          dot.style.setProperty("--dot-y", (y / 1402) * 100);
          dotLayer.appendChild(dot);
        });

        wheelWrap.appendChild(dotLayer);
      }

      function formatDate(date) {
        return date.toLocaleString("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function normalizePrizeName(name) {
        return String(name || "")
          .trim()
          .toLowerCase();
      }

      function getPrizeIndexFromName(prizeName) {
        const normalizedPrizeName = normalizePrizeName(prizeName);
        const prizeIndex = prizes.findIndex((prize) => {
          return (
            normalizePrizeName(prize.name) === normalizedPrizeName ||
            normalizePrizeName(prize.label) === normalizedPrizeName
          );
        });

        if (prizeIndex >= 0) {
          return prizeIndex;
        }

        return prizes.findIndex((prize) => prize.name === "Hard Luck");
      }

      function isHardLuckResult(result) {
        return normalizePrizeName(result.name || result.prize) === "hard luck";
      }

      async function getResultFromBackend(customer) {
        if (!GOOGLE_SCRIPT_URL.includes("script.google.com")) {
          throw new Error("Please add your Google Apps Script Web App URL.");
        }

        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(customer),
        });

        if (!response.ok) {
          throw new Error("Could not connect to Google Sheets.");
        }

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.message || "Google Sheets returned an error.");
        }

        return data;
      }

      function createResultFromBackend(data) {
        const backendResult = data.result || {};
        const expiryValue = backendResult.expiryDate || "";
        const expiryDateValue = expiryValue ? new Date(expiryValue) : null;

        return {
          label: backendResult.prize,
          name: backendResult.prize,
          code: backendResult.promoCode || "",
          expiresAt: expiryValue,
          expiry:
            expiryDateValue && !Number.isNaN(expiryDateValue.getTime())
              ? formatDate(expiryDateValue)
              : expiryValue,
          status: backendResult.status || "",
          branch: backendResult.branch || "Ghazir",
          alreadyPlayed: Boolean(data.alreadyPlayed),
        };
      }

      function isPromoExpired(result) {
        if (!result.expiresAt) {
          return false;
        }

        const expiresAt = new Date(result.expiresAt);

        if (Number.isNaN(expiresAt.getTime())) {
          return false;
        }

        return Date.now() > expiresAt;
      }

      function showResult(prize) {
        const isHardLuck = isHardLuckResult(prize);
        const isExpired = !isHardLuck && isPromoExpired(prize);

        currentResult = prize;
        resultTitle.textContent = prize.alreadyPlayed
          ? "You already Spun the wheel..."
          : isHardLuck
            ? "Hard Luck!"
            : "Congratulations!";
        resultName.textContent = prize.name;
        promoCode.textContent = prize.code;
        branchLine.textContent = `Only in ${prize.branch || "Ghazir"} Branch`;

        if (!isHardLuck) {
          expiryDate.textContent = `${isExpired ? "Expired on" : "Valid until"} ${
            prize.expiry || formatDate(new Date(prize.expiresAt))
          }`;
        }

        promoLabel.classList.toggle("is-hidden", isHardLuck);
        promoCode.classList.toggle("is-hidden", isHardLuck);
        promoCode.classList.toggle("is-expired", isExpired);
        expiryLine.classList.toggle("is-hidden", isHardLuck);
        branchLine.classList.toggle("is-hidden", isHardLuck);
        copyButton.classList.toggle("is-hidden", isHardLuck || isExpired);
        copyButton.textContent = "Copy Promocode";
        hardLuckMessage.classList.toggle("is-hidden", !isHardLuck);
        showScreen(resultScreen);
      }

      function normalizeRotation(degrees) {
        return ((degrees % 360) + 360) % 360;
      }

      function getSpinRotation(prizeIndex) {
        const prizeCenterAngle = prizeIndex * sliceAngle;
        const currentAngle = normalizeRotation(currentRotation);
        const targetAngle = normalizeRotation(pointerAngle - prizeCenterAngle);
        const rotationToTarget = normalizeRotation(targetAngle - currentAngle);

        return 360 * 4 + rotationToTarget;
      }

      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        currentCustomer = {
          name: registerForm.customerName.value.trim(),
          email: registerForm.customerEmail.value.trim(),
          phone: registerForm.customerPhone.value.trim(),
        };

        if (
          !currentCustomer.name ||
          !currentCustomer.email ||
          !currentCustomer.phone
        ) {
          window.alert("Please enter name, email, and phone number.");
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Checking...";

        try {
          const data = await getResultFromBackend(currentCustomer);
          const result = createResultFromBackend(data);

          pendingSpinResult = data.alreadyPlayed ? null : result;

          if (data.alreadyPlayed) {
            showResult(result);
          } else {
            goButton.disabled = false;
            goButton.textContent = "GO";
            showScreen(wheelScreen);
          }
        } catch (error) {
          window.alert(error.message || "Something went wrong.");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Submit";
        }
      });

      goButton.addEventListener("click", () => {
        if (isSpinning) {
          return;
        }

        if (!pendingSpinResult) {
          window.alert("Please register first.");
          showScreen(registerScreen);
          return;
        }

        isSpinning = true;
        goButton.disabled = true;
        goButton.textContent = "GO";

        const result = pendingSpinResult;
        const prizeIndex = getPrizeIndexFromName(result.name);

        currentRotation += getSpinRotation(prizeIndex);
        wheel.style.transform = `rotate(${currentRotation}deg)`;

        window.setTimeout(() => {
          goButton.disabled = false;
          goButton.textContent = "GO";
          isSpinning = false;
          pendingSpinResult = null;
          showResult(result);
        }, spinDurationMs);
      });

      copyButton.addEventListener("click", async () => {
        if (!currentResult || isPromoExpired(currentResult)) {
          copyButton.textContent = "Promocode Expired";
          return;
        }

        try {
          await navigator.clipboard.writeText(promoCode.textContent.trim());
          copyButton.textContent = "Copied";
        } catch (error) {
          copyButton.textContent = "Select Promocode";
        }

        window.setTimeout(() => {
          copyButton.textContent = "Copy Promocode";
        }, 1600);
      });

      backButton.addEventListener("click", () => {
        showScreen(registerScreen);
      });

      createWheelDetails();
    </script>
  </body>
</html>
